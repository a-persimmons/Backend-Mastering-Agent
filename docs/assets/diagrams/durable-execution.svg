<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 475" width="780" height="475" role="img" aria-labelledby="title desc"><title id="title">持久化执行与外部副作用</title><desc id="desc">关键故障窗口在外部写入成功、但本地尚未提交结果之间。恢复时用稳定幂等键查询或安全重试，不能承诺任意外部系统 exactly-once。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#60778b"/></marker></defs><rect x="1" y="1" width="778" height="473" rx="16" fill="#f8fafc" stroke="#d6e0e7"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="26" y="30" font-size="16" font-weight="650" fill="#526678">持久化执行与外部副作用</text><path d="M245.0 85.0 L285.0 85.0" fill="none" stroke="#60778b" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>

<path d="M745.0 85.0 L754.0 85.0 L754.0 345.0 L745.0 345.0" fill="none" stroke="#60778b" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><g><rect x="35" y="47" width="210" height="76" rx="12" fill="#eaf2ff" stroke="#83a9e0" stroke-width="1.4"/><text x="140" y="79" text-anchor="middle" fill="#1c4b81" font-size="19" font-weight="650">记录 Step</text><text x="140" y="103" text-anchor="middle" fill="#40566a" font-size="16" font-weight="450">稳定 step_id</text></g>
<g><rect x="285" y="47" width="210" height="76" rx="12" fill="#e6f5f0" stroke="#72b6a7" stroke-width="1.4"/><text x="390" y="79" text-anchor="middle" fill="#145e52" font-size="19" font-weight="650">外部工具执行</text><text x="390" y="103" text-anchor="middle" fill="#40566a" font-size="16" font-weight="450">idempotency_key</text></g>
<g><rect x="535" y="47" width="210" height="76" rx="12" fill="#eaf2ff" stroke="#83a9e0" stroke-width="1.4"/><text x="640" y="79" text-anchor="middle" fill="#1c4b81" font-size="19" font-weight="650">提交结果</text><text x="640" y="103" text-anchor="middle" fill="#40566a" font-size="16" font-weight="450">Checkpoint / Event</text></g>
<g><rect x="240" y="183" width="300" height="76" rx="12" fill="#fceeea" stroke="#d6a49b" stroke-width="1.4"/><text x="390" y="215" text-anchor="middle" fill="#923f31" font-size="19" font-weight="650">故障窗口</text><text x="390" y="239" text-anchor="middle" fill="#40566a" font-size="16" font-weight="450">外部成功 · 本地未提交</text></g>

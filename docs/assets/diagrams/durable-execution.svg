<g><rect x="285" y="307" width="210" height="76" rx="12" fill="#e6f5f0" stroke="#72b6a7" stroke-width="1.4"/><text x="390" y="339" text-anchor="middle" fill="#145e52" font-size="19" font-weight="650">查询外部结果</text><text x="390" y="363" text-anchor="middle" fill="#40566a" font-size="16" font-weight="450">同一幂等键</text></g>

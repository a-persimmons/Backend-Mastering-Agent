<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460" role="img" aria-labelledby="title desc"><title id="title">工程问题求解闭环</title><desc id="desc">在未知问题中，证据决定下一步；假设不成立就调整实验，而不是直接更换架构或技术栈。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#60778b"/></marker></defs><rect x="1" y="1" width="778" height="458" rx="16" fill="#f8fafc" stroke="#d6e0e7"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="26" y="30" font-size="16" font-weight="650" fill="#526678">工程问题求解闭环</text><path d="M245.0 82.0 L285.0 82.0" fill="none" stroke="#60778b" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>

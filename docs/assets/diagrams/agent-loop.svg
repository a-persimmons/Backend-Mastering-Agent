<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 530" width="780" height="530" role="img" aria-labelledby="title desc"><title id="title">有限 Agent Loop</title><desc id="desc">图：每轮先检查预算和取消状态；工具结果反馈到下一轮。模型给出最终答案、预算耗尽或审批等待都可结束当前执行。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#60778b"/></marker></defs><rect x="1" y="1" width="778" height="528" rx="16" fill="#f8fafc" stroke="#d6e0e7"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="26" y="30" font-size="16" font-weight="650" fill="#526678">有限 Agent Loop</text><path d="M390.0 96.0 L390.0 122.0" fill="none" stroke="#60778b" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M390.0 188.0 L390.0 215.0" fill="none" stroke="#60778b" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M235.0 155.0 L245.0 155.0" fill="none" stroke="#60778b" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M477.2 291.0 L552.8 324.0" fill="none" stroke="#60778b" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M302.8 291.0 L227.2 324.0" fill="none" stroke="#60778b" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M640.0 400.0 L640.0 424.0" fill="none" stroke="#60778b" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M745.0 462.0 L755.0 462.0 L755.0 155.0 L545.0 155.0" fill="none" stroke="#60778b" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><g><rect x="235" y="44" width="310" height="52" rx="12" fill="#ffffff" stroke="#9caaba" stroke-width="1.4"/><text x="390" y="76" text-anchor="middle" fill="#26384b" font-size="19" font-weight="650">接收任务 · 初始状态</text></g>
<g><rect x="235" y="122" width="310" height="66" rx="12" fill="#e6f5f0" stroke="#72b6a7" stroke-width="1.4"/><text x="390" y="161" text-anchor="middle" fill="#145e52" font-size="19" font-weight="650">预算 / deadline / 取消检查</text></g>
<g><rect x="260" y="215" width="260" height="76" rx="12" fill="#eaf2ff" stroke="#83a9e0" stroke-width="1.4"/><text x="390" y="247" text-anchor="middle" fill="#1c4b81" font-size="19" font-weight="650">调用模型</text><text x="390" y="271" text-anchor="middle" fill="#40566a" font-size="16" font-weight="450">获得下一步决策</text></g>
<g><rect x="535" y="324" width="210" height="76" rx="12" fill="#e6f5f0" stroke="#72b6a7" stroke-width="1.4"/><text x="640" y="356" text-anchor="middle" fill="#145e52" font-size="19" font-weight="650">工具调用</text><text x="640" y="380" text-anchor="middle" fill="#40566a" font-size="16" font-weight="450">校验 · 鉴权 · 执行</text></g>
<g><rect x="535" y="424" width="210" height="76" rx="12" fill="#eaf2ff" stroke="#83a9e0" stroke-width="1.4"/><text x="640" y="456" text-anchor="middle" fill="#1c4b81" font-size="19" font-weight="650">记录结果</text><text x="640" y="480" text-anchor="middle" fill="#40566a" font-size="16" font-weight="450">更新上下文</text></g>
<g><rect x="35" y="324" width="210" height="76" rx="12" fill="#e6f5f0" stroke="#72b6a7" stroke-width="1.4"/><text x="140" y="356" text-anchor="middle" fill="#145e52" font-size="19" font-weight="650">最终答案</text><text x="140" y="380" text-anchor="middle" fill="#40566a" font-size="16" font-weight="450">完成任务</text></g>
<g><rect x="35" y="117" width="210" height="76" rx="12" fill="#fceeea" stroke="#d6a49b" stroke-width="1.4"/><text x="140" y="149" text-anchor="middle" fill="#923f31" font-size="19" font-weight="650">终止 / 等待</text><text x="140" y="173" text-anchor="middle" fill="#40566a" font-size="16" font-weight="450">失败或预算耗尽</text></g></g></svg>

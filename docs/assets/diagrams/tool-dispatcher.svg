<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 405" width="780" height="405" role="img" aria-labelledby="title desc"><title id="title">Tool Dispatcher：可信执行边界</title><desc id="desc">图：模型只能提出工具意图；校验、授权、审批、超时和幂等由程序执行。任一检查不通过即拒绝，不接触真实工具。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#60778b"/></marker></defs><rect x="1" y="1" width="778" height="403" rx="16" fill="#f8fafc" stroke="#d6e0e7"/><g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="26" y="30" font-size="16" font-weight="650" fill="#526678">Tool Dispatcher：可信执行边界</text><path d="M245.0 80.0 L285.0 80.0" fill="none" stroke="#60778b" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
